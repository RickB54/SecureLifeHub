<!DOCTYPE html>
<html>

<head>
  <title>SecureLifeHub</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>

<body class="bg-[#1e1e1e] text-gray-200 overflow-hidden text-sm h-[500px] w-[500px] m-0 p-0">

  <!-- Auth Section (Login) -->
  <div id="auth-section" class="hidden flex flex-col items-center justify-center h-full p-8 bg-[#1e1e1e]">
    <div class="mb-6 flex flex-col items-center">
      <img src="icons/icon128.png" alt="SecureLifeHub" class="w-16 h-16 mb-2 rounded-full shadow-lg">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
        SecureLifeHub</h1>
    </div>
    <form id="login-form" class="w-full max-w-xs space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">Email</label>
        <input type="email" id="email" required
          class="w-full px-3 py-2 bg-[#2d2d2d] border border-gray-700 rounded focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors placeholder-gray-600">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Password</label>
        <input type="password" id="password" required
          class="w-full px-3 py-2 bg-[#2d2d2d] border border-gray-700 rounded focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors">
      </div>
      <button type="submit"
        class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium transition-colors shadow-lg shadow-blue-900/20">Sign
        In</button>
      <p id="error-msg" class="text-red-400 text-xs text-center hidden"></p>
    </form>
  </div>

  <!-- Main Vault Interface (Split Pane) -->
  <div id="vault-section" class="hidden flex h-full">

    <!-- Sidebar (List) -->
    <div class="w-48 bg-[#252526] border-r border-[#3e3e42] flex flex-col h-full shrink-0">
      <!-- Header/Search -->
      <div class="p-3 border-b border-[#3e3e42] bg-[#252526] sticky top-0 z-10 space-y-2">
        <div class="flex items-center justify-between mb-2">
          <span class="font-bold text-gray-100 flex items-center gap-2">
            <img src="icons/icon128.png" class="w-5 h-5 rounded-full" alt="SLH"> Vault <span
              class="text-[9px] bg-blue-500/20 text-blue-400 px-1.5 py-0.5 rounded-full">v1.2</span>
          </span>
          <div class="flex gap-1">
            <button id="extension-reload-btn" class="p-1.5 hover:bg-[#3e3e42] rounded text-gray-400 hover:text-white"
              title="Reload Extension">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                </path>
              </svg>
            </button>
            <button id="add-btn" class="p-1.5 hover:bg-[#3e3e42] rounded text-gray-400 hover:text-white"
              title="New Item">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
            </button>
            <button id="menu-btn" class="p-1.5 hover:bg-[#3e3e42] rounded text-gray-400 hover:text-white" title="Menu">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z">
                </path>
              </svg>
            </button>
          </div>
        </div>
        <div class="relative">
          <input type="text" id="search" placeholder="Search Vault..."
            class="w-full pl-8 pr-3 py-1.5 bg-[#1e1e1e] border border-[#3e3e42] rounded text-xs text-gray-300 focus:border-blue-500 focus:outline-none">
          <svg class="w-3.5 h-3.5 absolute left-2.5 top-2 text-gray-500" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex border-b border-[#3e3e42] bg-[#252526]">
        <button id="tab-vault"
          class="flex-1 py-2 text-[10px] font-bold uppercase tracking-wider text-blue-500 border-b-2 border-blue-500 transition-colors">Vault</button>
        <button id="tab-sections"
          class="flex-1 py-2 text-[10px] font-bold uppercase tracking-wider text-gray-500 hover:text-gray-300 transition-colors">Sections</button>
      </div>

      <!-- Scrollable Area -->
      <div class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar">
        <!-- Vault View (Default) -->
        <div id="vault-view" class="flex flex-col">
          <div id="items-list" class="p-2 space-y-0.5">
            <!-- Items injected here -->
          </div>
        </div>

        <!-- Sections View (Menu Navigation) -->
        <div id="sections-view" class="hidden p-2 space-y-4">
          <!-- Categories injected here -->
        </div>
      </div>
    </div>

    <!-- Main Panel (Details) -->
    <div class="flex-1 bg-[#1e1e1e] flex flex-col h-full overflow-hidden relative min-w-0">

      <!-- Empty State -->
      <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-gray-500">
        <svg class="w-16 h-16 mb-4 text-[#333]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
          </path>
        </svg>
        <p>Select an item to view details</p>
        <p class="text-xs opacity-50 mt-1">or click + to add new</p>
      </div>

      <!-- Item Detail View -->
      <div id="detail-view" class="hidden flex flex-col h-full">
        <!-- Toolbar -->
        <div class="h-14 border-b border-[#333] flex items-center justify-between px-6 bg-[#252526] shrink-0">
          <div class="flex items-center gap-3 min-w-0">
            <div id="view-icon"
              class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg shrink-0">
              G</div>
            <h2 id="view-title" class="text-lg font-semibold truncate">Title</h2>
            <button id="view-fav-btn" class="text-gray-500 hover:text-yellow-500 transition-colors shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z">
                </path>
              </svg>
            </button>
          </div>
          <div class="flex gap-2 shrink-0">
            <button id="edit-btn"
              class="px-3 py-1.5 bg-[#3e3e42] hover:bg-[#4e4e52] rounded text-xs font-medium transition-colors">Edit</button>
          </div>
        </div>

        <!-- Fields -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">

          <!-- Username -->
          <div class="group">
            <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Username / Email</label>
            <div
              class="flex items-center justify-between text-gray-200 text-sm py-1 border-b border-[#333] group-hover:border-gray-500 transition-colors">
              <span id="view-username" class="select-all truncate mr-2">user@example.com</span>
              <button class="copy-btn text-gray-500 hover:text-white p-1 shrink-0" data-target="view-username"
                title="Copy">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                  </path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Password -->
          <div class="group">
            <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Password</label>
            <div
              class="flex items-center justify-between text-gray-200 text-sm py-1 border-b border-[#333] group-hover:border-gray-500 transition-colors">
              <span id="view-password"
                class="tracking-widest filter blur-[4px] hover:blur-none transition-all cursor-pointer truncate mr-2">••••••••</span>
              <div class="flex gap-1 shrink-0">
                <button id="toggle-pass-btn" class="text-gray-500 hover:text-white p-1" title="Show/Hide">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                    </path>
                  </svg>
                </button>
                <button class="copy-btn text-gray-500 hover:text-white p-1" data-target="view-password" title="Copy">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                    </path>
                  </svg>
                </button>
              </div>
            </div>
            <div id="password-strength-bar" class="h-1 w-full bg-gray-700 mt-2 rounded overflow-hidden">
              <div class="h-full bg-green-500 w-3/4"></div>
            </div>
          </div>

          <!-- Website -->
          <div class="group">
            <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Website</label>
            <div class="flex flex-col gap-2 py-1 border-b border-[#333] group-hover:border-gray-500 transition-colors">
              <span id="view-website" class="text-gray-200 text-sm truncate select-all">google.com</span>
              <div class="flex items-center gap-2">
                <button id="manual-fill-btn"
                  class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-1.5 px-3 rounded flex items-center justify-center gap-2 font-semibold text-xs transition-colors shadow-lg"
                  title="Auto-Fill Credentials">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 10V3L4 14h7v7l9-11h-7z">
                    </path>
                  </svg>
                  Auto-Fill
                </button>
                <button id="launch-btn"
                  class="flex-1 bg-gray-800 hover:bg-gray-700 text-blue-400 hover:text-blue-300 py-1.5 px-3 rounded flex items-center justify-center gap-2 font-semibold text-[10px] uppercase transition-colors"
                  title="Launch Site">
                  Launch <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Custom Fields Container -->
          <div id="view-custom-fields-container" class="space-y-4 pt-4 border-t border-[#333] hidden">
            <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Custom Fields</label>
            <div id="custom-fields-list" class="space-y-3">
              <!-- Populated via JS -->
            </div>
          </div>

          <!-- Financial Card Fields (Conditional) -->
          <div id="view-financial-fields-container" class="space-y-4 pt-4 border-t border-[#333] hidden">
            <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Card Details</label>
            <div id="financial-fields-list" class="space-y-3">
              <!-- Populated via JS -->
            </div>
          </div>

          <!-- Notes -->
          <div class="group flex-1 flex flex-col min-h-[100px]">
            <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Notes</label>
            <div
              class="flex-1 bg-[#252526] p-3 rounded border border-[#333] relative group-hover:border-gray-600 transition-colors">
              <p id="view-notes" class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed break-words">My notes
                go here...</p>
              <button class="copy-btn absolute top-2 right-2 text-gray-500 hover:text-white p-1"
                data-target="view-notes">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                  </path>
                </svg>
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- Edit/Create Form -->
      <div id="edit-form" class="hidden flex flex-col h-full bg-[#1e1e1e]">
        <div class="h-14 border-b border-[#333] flex items-center justify-between px-6 bg-[#252526] shrink-0">
          <h2 id="form-title" class="text-lg font-semibold">Edit Item</h2>
          <div class="flex gap-2">
            <button id="cancel-edit-btn"
              class="px-3 py-1.5 text-gray-400 hover:text-white text-xs font-medium">Cancel</button>
            <button id="save-btn"
              class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-medium transition-colors">Save</button>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
          <input type="hidden" id="edit-id">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Title</label>
            <input type="text" id="edit-title"
              class="w-full bg-[#2d2d2d] border border-gray-700 rounded p-2 text-sm text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Username</label>
            <input type="text" id="edit-username"
              class="w-full bg-[#2d2d2d] border border-gray-700 rounded p-2 text-sm text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Password</label>
            <div class="flex gap-2">
              <input type="text" id="edit-password"
                class="w-full bg-[#2d2d2d] border border-gray-700 rounded p-2 text-sm text-white focus:border-blue-500 focus:outline-none">
              <button type="button" id="gen-pass-btn"
                class="bg-gray-700 hover:bg-gray-600 px-3 rounded text-xs text-white shrink-0">Generate</button>
            </div>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Website</label>
            <input type="text" id="edit-website"
              class="w-full bg-[#2d2d2d] border border-gray-700 rounded p-2 text-sm text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Category</label>
              <select id="edit-category"
                class="w-full bg-[#2d2d2d] border border-gray-700 rounded p-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                <option value="General">General</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Finance">Finance</option>
                <option value="Social">Social</option>
                <option value="Servers">Servers</option>
                <option value="Health Insurance">Health Insurance</option>
                <option value="Memberships">Memberships</option>
                <option value="Secure Notes">Secure Notes</option>
                <option value="Passports">Passports</option>
                <option value="Identity Cards">Identity Cards</option>
                <option value="Software Licenses">Software Licenses</option>
                <option value="SSH Keys">SSH Keys</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Folder</label>
              <select id="edit-folder"
                class="w-full bg-[#2d2d2d] border border-gray-700 rounded p-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                <option value="">None</option>
                <!-- Folders filled via JS -->
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Picture</label>
            <div class="flex items-center gap-4">
              <div id="edit-picture-preview"
                class="w-12 h-12 rounded bg-[#333] border border-gray-700 flex items-center justify-center overflow-hidden">
                <span class="text-[10px] text-gray-500">No Image</span>
              </div>
              <input type="file" id="edit-picture-input" accept="image/*" class="hidden">
              <button type="button" onclick="document.getElementById('edit-picture-input').click()"
                class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-[10px] text-white transition-colors">Choose
                File</button>
            </div>
          </div>
          <!-- Custom Fields Edit Section -->
          <div id="edit-custom-fields-section" class="pt-2">
            <label class="block text-xs text-gray-400 mb-2">Custom Fields</label>
            <div id="edit-custom-fields-list" class="space-y-3 mb-3">
              <!-- Custom fields inputs -->
            </div>
            <button type="button" id="add-custom-field-btn"
              class="flex items-center gap-1 text-blue-400 hover:text-blue-300 text-xs font-semibold">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              Add Custom Field
            </button>
          </div>
          <div class="flex-1 flex flex-col">
            <label class="block text-xs text-gray-400 mb-1">Notes</label>
            <textarea id="edit-notes"
              class="w-full h-32 bg-[#2d2d2d] border border-gray-700 rounded p-2 text-sm text-white focus:border-blue-500 focus:outline-none resize-none"></textarea>
          </div>
          <div class="pt-4 border-t border-[#333] flex justify-between items-center">
            <button type="button" id="delete-btn"
              class="text-red-500 hover:text-red-400 text-xs font-medium flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
              </svg>
              Delete Record
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Menu dropdown (Absolute) -->
    <div id="menu-dropdown"
      class="hidden absolute top-12 left-4 w-56 bg-[#2d2d2d] border border-gray-700 rounded-lg shadow-2xl z-50 overflow-hidden flex flex-col text-sm">
      <div class="p-3 border-b border-gray-700">
        <p id="menu-user-email" class="text-xs text-gray-400 truncate">user@example.com</p>
      </div>

      <!-- Recents Toggle -->
      <button id="menu-recents-btn"
        class="flex items-center gap-3 px-4 py-3 hover:bg-[#3e3e42] transition-colors border-b border-gray-700 text-gray-200">
        <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>Recents</span>
      </button>

      <!-- Auto Fill Toggle -->
      <button id="autofill-toggle-btn"
        class="flex items-center justify-between px-4 py-3 hover:bg-[#3e3e42] transition-colors border-b border-gray-700">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
          <span>Auto-Fill</span>
        </div>
        <span id="autofill-status" class="text-xs font-bold px-2 py-0.5 rounded bg-gray-600 text-gray-300">OFF</span>
      </button>

      <button id="open-vault-btn"
        class="flex items-center gap-3 px-4 py-3 hover:bg-[#3e3e42] transition-colors text-gray-200">
        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
        </svg>
        Open Web Vault
      </button>
      <button id="open-financial-btn"
        class="flex items-center gap-3 px-4 py-3 hover:bg-[#3e3e42] transition-colors text-gray-200">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
        </svg>
        Financial Cards
      </button>
      <button id="quick-sync"
        class="flex items-center gap-3 px-4 py-3 hover:bg-[#3e3e42] transition-colors text-gray-200">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
          </path>
        </svg>
        Sync Now
      </button>
      <div class="h-px bg-gray-700 my-1"></div>
      <button id="logout-menu-btn"
        class="flex items-center gap-3 px-4 py-3 hover:bg-red-900/30 text-red-400 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Log Out
      </button>
    </div>

    <!-- Overlay Menu Back_drop -->
    <div id="menu-overlay" class="hidden absolute inset-0 bg-black/50 z-40 backdrop-blur-sm"></div>

  </div>

  <!-- Overlay: Auto-Fill Disabled -->
  <div id="autofill-disabled-overlay"
    class="hidden absolute inset-0 bg-black/80 z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-[#252526] p-6 rounded-lg shadow-2xl border border-gray-700 max-w-xs text-center">
      <div
        class="w-12 h-12 bg-yellow-500/20 text-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
      <h3 class="text-lg font-bold text-white mb-2">Auto-Fill is Off</h3>
      <p class="text-gray-400 text-sm mb-6">Enable auto-fill to instantly fill credentials on this site.</p>
      <div class="flex flex-col gap-3">
        <button id="enable-autofill-btn"
          class="w-full py-2 bg-green-600 hover:bg-green-500 text-white rounded font-medium transition-colors">Enable &
          Fill</button>
        <button id="cancel-autofill-btn"
          class="w-full py-2 hover:bg-gray-700 text-gray-400 rounded transition-colors">Cancel</button>
      </div>
    </div>
  </div>

</body>
