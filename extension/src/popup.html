<!DOCTYPE html>
<html>

<head>
  <title>SecureLifeHub</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>

<body class="w-80 bg-[#2a2a2a] text-white overflow-hidden text-sm font-sans relative" style="min-height: 500px;">

  <!-- Header -->
  <header class="bg-[#212121] p-3 flex items-center justify-between border-b border-gray-700">
    <div class="flex items-center gap-2 font-bold text-[#F5B041]">
      <img src="icons/icon48.png" class="w-6 h-6 rounded-full bg-white" alt="Logo">
      <span>SECURELIFE<span class="text-white">HUB</span></span>
    </div>

    <div class="flex gap-2">
      <button id="add-btn" class="p-2 hover:bg-gray-700 rounded-full text-gray-300" title="Add Record">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button id="menu-btn" class="p-2 hover:bg-gray-700 rounded-full text-gray-300" title="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="12" cy="5" r="1"></circle>
          <circle cx="12" cy="19" r="1"></circle>
        </svg>
      </button>
    </div>
  </header>

  <!-- Login Section -->
  <div id="auth-section" class="p-6 flex flex-col items-center justify-center h-full hidden">
    <h2 class="text-xl font-bold mb-6">Welcome Back</h2>
    <form id="login-form" class="w-full space-y-4">
      <input type="email" id="email" placeholder="Email Address"
        class="w-full p-3 rounded bg-[#333] border border-gray-600 focus:border-[#F5B041] outline-none transition-colors"
        required>
      <input type="password" id="password" placeholder="Master Password"
        class="w-full p-3 rounded bg-[#333] border border-gray-600 focus:border-[#F5B041] outline-none transition-colors"
        required>
      <button type="submit"
        class="w-full bg-[#F5B041] hover:bg-[#D4AC0D] text-black font-bold p-3 rounded transition-colors">Login</button>
      <p id="error-msg" class="text-red-400 text-xs text-center hidden"></p>
    </form>
  </div>

  <!-- Vault Section -->
  <div id="vault-section" class="flex flex-col h-full hidden">
    <!-- Search -->
    <div class="p-3 bg-[#2a2a2a]">
      <div class="relative">
        <svg class="absolute left-3 top-2.5 text-gray-500 w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="search" placeholder="Search Vault..."
          class="w-full pl-10 pr-4 py-2 bg-[#1a1a1a] rounded-full border border-gray-700 focus:border-[#F5B041] outline-none text-sm">
      </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4">

      <!-- Current Site Matches -->
      <div id="current-site-matches" class="hidden">
        <h3 class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide px-1">Suggested</h3>
        <div id="matches-list" class="space-y-2"></div>
      </div>

      <!-- All Items -->
      <div id="all-items">
        <h3 class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide px-1">All Items</h3>
        <div id="items-list" class="space-y-2 pb-20"></div>
      </div>
    </div>
  </div>

  <!-- Menu Overlay (Initially Hidden) -->
  <div id="menu-overlay" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
    <div class="bg-[#333] rounded-t-xl overflow-hidden shadow-2xl animate-slide-up">
      <div class="p-2 border-b border-gray-700 flex justify-between items-center bg-[#2a2a2a]">
        <span class="font-bold px-3">Menu</span>
        <button id="close-menu" class="p-2 hover:bg-gray-700 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="py-2">
        <a href="http://localhost:3000/generate-password" target="_blank"
          class="flex items-center px-4 py-3 hover:bg-gray-700 transition-colors">
          <svg class="w-5 h-5 mr-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Password Generator
        </a>
        <a href="http://localhost:3000/settings" target="_blank"
          class="flex items-center px-4 py-3 hover:bg-gray-700 transition-colors">
          <svg class="w-5 h-5 mr-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          Settings
        </a>
        <a href="http://localhost:3000/dashboard" target="_blank"
          class="flex items-center px-4 py-3 hover:bg-gray-700 transition-colors">
          <svg class="w-5 h-5 mr-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          Open in Web Vault
        </a>
        <div class="h-px bg-gray-700 my-1 mx-4"></div>
        <button id="quick-sync"
          class="w-full flex items-center px-4 py-3 hover:bg-gray-700 transition-colors text-left">
          <svg class="w-5 h-5 mr-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"></path>
          </svg>
          Quick Sync
        </button>
        <button id="logout-menu-btn"
          class="w-full flex items-center px-4 py-3 hover:bg-gray-700 transition-colors text-left text-red-400">
          <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Log Out
        </button>
      </div>
    </div>
  </div>
</body>

</html>
